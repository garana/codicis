# Backing services for the codicis data-helper integration tests.
#
#   docker compose -f helpers/docker/docker-compose.yml up -d
#   # then, from helpers/:
#   CODICIS_PG_DSN='postgres://codicis:codicis@localhost:5432/codicis?sslmode=disable' \
#     make integration-postgres
#
# Databases are here now; message-queue brokers (Kafka, RabbitMQ, NATS, Redis,
# MQTT, LocalStack for SNS/SQS) are added alongside the feed-fanout helpers.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codicis
      POSTGRES_PASSWORD: codicis
      POSTGRES_DB: codicis
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codicis"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codicis
      MYSQL_USER: codicis
      MYSQL_PASSWORD: codicis
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcodicis"]
      interval: 2s
      timeout: 3s
      retries: 40

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Message-queue brokers for the feed-fanout bridges ----

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2
    ports: ["4222:4222"]

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: codicis
      RABBITMQ_DEFAULT_PASS: codicis
    ports: ["5672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports: ["1883:1883"]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sns,sqs
    ports: ["4566:4566"]
