# codicis example configuration
#
# Format: one "key = value" per line; '#' starts a comment. Keys use dotted
# namespaces. Every key here can also be given as a CLI flag of the same name,
# e.g. --net.http_port=8080. CLI flags override file values.
#
# NOTE: the config subsystem lands in phase P1; keys below are the intended
# schema and may evolve. This file documents the shared name space.

# ---- Network -------------------------------------------------------------

# TCP port for the HTTP/S REST API.
net.http_port = 8080

# TCP port for WebSocket connections.
net.ws_port = 8081

# Optional internal aggregator WebSocket listener. When enabled, a connection
# whose handshake carries NO identity supplies a per-frame `user` uuid on each
# message, letting one connection multiplex many end-users (for an internal
# request aggregator). Bind it to a private address and restrict it at the
# network layer -- the port itself is the trust boundary.
net.aggregator_ws_enabled = false
net.aggregator_ws_port = 8082

# Bind address for the aggregator listener. Empty reuses net.bind_address.
# Keep this on a private/loopback interface even if the public ports bind a
# wider address -- the port is the trust boundary for per-frame identity.
net.aggregator_ws_bind_address =

# Address to bind listeners to.
net.bind_address = 127.0.0.1

# ---- Order book ----------------------------------------------------------

# Maximum number of price levels kept in memory per side (top of book).
book.mem_levels = 100

# ---- Storage helper ------------------------------------------------------

# Command used to launch the storage helper child process.
storage.helper_cmd = ./codicis_storage_helper

# Wire encoding for the helper protocol: "text" (key=value) or "binary".
storage.codec = text

# Maximum number of un-committed entries in the processed queue before the
# server applies backpressure to clients.
storage.processed_queue_max = 10000

# Fail a storage helper request whose response does not arrive within this many
# milliseconds (0 disables timeouts).
storage.request_timeout_ms = 5000

# ---- Ingress helper ------------------------------------------------------

# Optional client-request ingress helper. When set, codicis spawns this command
# as a managed child that is the SOURCE of order/cancel traffic (pulled from its
# own external system -- Kafka, RabbitMQ, SQS, ...). It initiates requests over
# the same helper codec as the storage helper: it writes requests to its stdout
# (codicis reads) and reads replies on its stdin. Each request carries a per-
# message `user` uuid; trust comes from it being a private-pipe managed child.
# The reference tool reads request lines from a file given as its argument.
# Empty = disabled. Example: ./codicis_ingress_helper /path/to/requests.txt
ingress.helper_cmd =

# ---- Market-data feed helper ---------------------------------------------

# Optional market-data feed helper. When set, codicis spawns this command and
# streams the sequence-numbered book-event feed to its stdin (best-effort and
# non-blocking: if the helper falls behind, events are dropped rather than
# stalling the matcher, and the seq gap triggers the helper's resync). The
# reference tool builds L1/L2/L3 and fans out to TCP subscribers on its own
# listen address (its own args). Empty = disabled.
# Example: ./codicis_feed_helper 127.0.0.1 9100
feed.helper_cmd =

# ---- Authentication ------------------------------------------------------
#
# Identity of the requesting user. Two non-exclusive mechanisms; both off by
# default (orders are anonymous). The owner UUID is never taken from the
# request body. When both are enabled, both must pass and resolve to the same
# UUID. See the README "Authentication and authorization" section.

# Option A: trust a pre-authenticated user UUID from a request header.
auth.header.enabled = false
auth.header.name = X-User-Id

# Option B: validate a credential header via a pool of auth helper processes.
auth.helper.enabled = false
auth.helper.cmd = ./codicis_auth_helper
auth.helper.concurrency = 1
auth.helper.pipelining = true
auth.helper.pipeline_depth = 8
auth.helper.credential_header = Authorization
auth.helper.request_timeout_ms = 5000

# Positive (validated) and negative (rejected) credential caches. Each is
# bounded by an entry count and an optional byte budget (max_bytes, 0 = no byte
# limit). A positive entry lives until the helper's not_after, capped by ttl_ms.
# Negative entries have no not_after, so negative_ttl_ms is their only age
# bound; keep it short so revoked/mistyped credentials clear quickly.
auth.cache.max_entries = 4096
auth.cache.max_bytes = 0
auth.cache.ttl_ms = 60000
auth.cache.negative_max_entries = 1024
auth.cache.negative_max_bytes = 0
auth.cache.negative_ttl_ms = 5000

# Each insert opportunistically reclaims expired entries from the cache tail,
# capped at this many per insert so one request never sweeps a whole cache
# (0 = unbounded).
auth.cache.max_purge_per_insert = 16

# ---- Metrics -------------------------------------------------------------

# Expose a Prometheus text metrics endpoint over HTTP at metrics.path. It
# requires no identity, so restrict it at the edge like /health and /book.
metrics.enabled = true
metrics.path = /metrics

# ---- Logging -------------------------------------------------------------

# Minimum log level: trace | debug | info | warn | error.
log.level = info
